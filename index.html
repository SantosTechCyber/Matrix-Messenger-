<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our chat</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f5f7; height: 100vh; display: flex; flex-direction: column; }
  header { background: #fff; padding: 12px 16px; border-bottom: 1px solid #e2e4e8; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .b { max-width: 75%; padding: 8px 12px; border-radius: 12px; background: #fff; border: 1px solid #e2e4e8; word-wrap: break-word; font-size: 15px; }
  .b.mine { align-self: flex-end; background: #dbeafe; border-color: #bfdbfe; }
  .who { font-size: 11px; color: #6b7280; margin-bottom: 2px; }
  form { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #e2e4e8; }
  input { flex: 1; padding: 10px; border: 1px solid #e2e4e8; border-radius: 8px; font-size: 16px; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
  .small { padding: 6px 10px; font-size: 12px; background: #fff; color: #111; border: 1px solid #ccc; }
  .setup { max-width: 360px; margin: 60px auto; padding: 20px; background: #fff; border-radius: 12px; border: 1px solid #e2e4e8; width: calc(100% - 32px); }
  .setup input { width: 100%; margin-bottom: 10px; box-sizing: border-box; }
  .setup button { width: 100%; }
  .hidden { display: none !important; }
  #err { color: #b91c1c; font-size: 14px; }
</style>
</head>
<body>

<div class="setup" id="setup">
  <h2>Join your chat</h2>
  <input id="name" placeholder="Your name">
  <input id="room" placeholder="Four words, e.g. I will love you">
  <button onclick="join()">Join</button>
  <p id="err"></p>
</div>

<div id="chat" class="hidden" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
  <header>
    <b>Our chat</b>
    <button class="small" onclick="localStorage.clear(); location.reload()">Switch</button>
  </header>
  <div id="msgs"></div>
  <form onsubmit="send(event)">
    <input id="text" placeholder="Message" autocomplete="off">
    <button>Send</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://wixoozjehdypfrhcbpgm.supabase.co";
  const SUPABASE_KEY = "sb_publishable_cUL2LwPX1EpyU930JRxZPA_sZzkOceC";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let me = localStorage.getItem('name') || '';
  let roomCode = localStorage.getItem('room') || '';
  let messages = [];

  function join() {
    const name = document.getElementById('name').value.trim();
    const code = document.getElementById('room').value
      .toLowerCase()
      .replace(/[^\p{L}\p{N}\s]/gu, '')
      .trim()
      .split(/\s+/)
      .join(' ');
    if (!name || code.split(' ').length !== 4) {
      document.getElementById('err').textContent = 'Enter your name and a secret code of exactly four words.';
      return;
    }
    me = name;
    roomCode = code;
    localStorage.setItem('name', name);
    localStorage.setItem('room', code);
    start();
  }

  async function start() {
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('chat').classList.remove('hidden');

    const { data, error } = await sb.from('messages')
      .select('*')
      .eq('room', roomCode)
      .order('created_at', { ascending: true })
      .limit(200);
    if (error) { showError('Could not load messages: ' + error.message); return; }
    messages = data || [];
    renderAll();

    // Live updates: new messages appear on both phones as they're sent
    sb.channel('room-' + roomCode)
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + roomCode
      }, payload => {
        messages.push(payload.new);
        renderAll();
      })
      .subscribe();
  }

  function renderAll() {
    const box = document.getElementById('msgs');
    box.innerHTML = '';
    messages.forEach(m => {
      const d = document.createElement('div');
      d.className = 'b' + (m.name === me ? ' mine' : '');
      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = m.name;
      d.appendChild(who);
      d.appendChild(document.createTextNode(m.body));
      box.appendChild(d);
    });
    box.scrollTop = box.scrollHeight;
  }

  async function send(e) {
    e.preventDefault();
    const input = document.getElementById('text');
    const body = input.value.trim();
    if (!body) return;
    input.value = '';
    const { error } = await sb.from('messages').insert({ room: roomCode, name: me, body });
    if (error) showError('Message not sent: ' + error.message);
  }

  function showError(text) {
    document.getElementById('err').textContent = text;
  }

  if (me && roomCode) start();
</script>
</body>
</html>
